<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어근 원정대">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111722" media="(prefers-color-scheme: dark)">
<meta name="description" content="영어 어휘 Day 9~16을 접두사 방향별로 익히는 개인 학습용 페이지">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>어근 원정대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#E9EDF2; --card:#FBFCFD; --card-2:#F1F4F8;
  --ink:#141922; --ink-2:#414A59; --ink-3:#6E7889;
  --rule:#C9D2DE; --rule-2:#DFE5EC;
  --acc:#1F5FA8; --acc-ink:#FFFFFF;
  --ok:#2F7D3E; --ok-bg:#E4F1E6;
  --bad:#B8442C; --bad-bg:#FAE7E2;
  --warn:#9A6E00;
  --f1:#2A6FC4; --f2:#B8442C; --f3:#1E8A5F; --f4:#A6398A; --f5:#9A6E00;
  --shadow:0 1px 2px rgba(20,25,34,.06), 0 8px 24px rgba(20,25,34,.07);
  --shadow-lift:0 2px 4px rgba(20,25,34,.08), 0 16px 40px rgba(20,25,34,.12);
  --grid:rgba(42,111,196,.055);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111722; --card:#1A2230; --card-2:#212B3B;
    --ink:#EDF1F6; --ink-2:#B3BDCB; --ink-3:#7F8B9C;
    --rule:#313D4F; --rule-2:#273141;
    --acc:#5B95E0; --acc-ink:#0B1018;
    --ok:#4FA366; --ok-bg:#16301F;
    --bad:#D9694E; --bad-bg:#33190F;
    --warn:#BC8318;
    --f1:#5B95E0; --f2:#D9694E; --f3:#4FA366; --f4:#C267A4; --f5:#BC8318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
    --grid:rgba(91,149,224,.07);
  }
}
:root[data-theme="dark"]{
  --paper:#111722; --card:#1A2230; --card-2:#212B3B;
  --ink:#EDF1F6; --ink-2:#B3BDCB; --ink-3:#7F8B9C;
  --rule:#313D4F; --rule-2:#273141;
  --acc:#5B95E0; --acc-ink:#0B1018;
  --ok:#4FA366; --ok-bg:#16301F;
  --bad:#D9694E; --bad-bg:#33190F;
  --warn:#BC8318;
  --f1:#5B95E0; --f2:#D9694E; --f3:#4FA366; --f4:#C267A4; --f5:#BC8318;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
  --grid:rgba(91,149,224,.07);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:16px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 40px; min-height:100dvh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.eng{font-family:'Bricolage Grotesque','IBM Plex Sans KR',sans-serif; font-weight:700; letter-spacing:-.01em}

/* ---------- 상단 ---------- */
.top{display:flex; align-items:center; gap:10px; margin-bottom:18px}
.brand{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.02em; flex:1}
.brand span{color:var(--ink-3); font-weight:500; font-size:13px; letter-spacing:0; margin-left:7px}
.iconbtn{
  width:38px; height:38px; flex:none; border-radius:11px; border:1px solid var(--rule);
  background:var(--card); color:var(--ink-2); font-size:16px; cursor:pointer; display:grid; place-items:center;
}
.iconbtn:hover{background:var(--card-2)}
.iconbtn:focus-visible,.btn:focus-visible,.choice:focus-visible,.daycard:focus-visible,.chip:focus-visible{outline:3px solid var(--acc); outline-offset:2px}

/* ---------- 홈: 방향 지도 ---------- */
.kicker{font-size:11.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); margin:22px 0 9px}
.kicker:first-of-type{margin-top:6px}

.overall{
  background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:15px 17px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:16px;
}
.overall .num{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:34px; line-height:1; letter-spacing:-.03em}
.overall .sub{font-size:12.5px; color:var(--ink-3); margin-top:3px}
.overall .rail{flex:1}
.rail{height:8px; border-radius:99px; background:var(--rule-2); overflow:hidden}
.rail>i{display:block; height:100%; border-radius:99px; background:var(--acc); transition:width .5s cubic-bezier(.2,.8,.3,1)}

.daygrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.daycard{
  position:relative; text-align:left; cursor:pointer; overflow:hidden;
  background:var(--card); border:1px solid var(--rule); border-radius:15px; padding:13px 13px 12px;
  box-shadow:var(--shadow); color:inherit; font:inherit; transition:transform .12s, box-shadow .12s;
}
.daycard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.daycard:active{transform:translateY(0)}
.daycard .bar{position:absolute; inset:0 auto 0 0; width:4px; background:var(--fc)}
.daycard .hd{display:flex; align-items:baseline; gap:7px; margin-left:6px}
.daycard .dn{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:17px; letter-spacing:-.02em}
.daycard .ar{font-size:15px; color:var(--fc); font-weight:700}
.daycard .dir{margin-left:6px; font-size:13.5px; font-weight:600; color:var(--ink); margin-top:1px}
.daycard .sig{margin-left:6px; font-size:11.5px; color:var(--ink-3); font-family:'IBM Plex Mono',monospace}
.daycard .ft{margin-left:6px; margin-top:10px; display:flex; align-items:center; gap:7px}
.daycard .ft .rail{flex:1; height:6px}
.daycard .ft .rail>i{background:var(--fc)}
.daycard .pct{font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--ink-3); min-width:30px; text-align:right}
.stars{margin-left:6px; margin-top:6px; font-size:12px; letter-spacing:1px; color:var(--warn)}
.stars .off{color:var(--rule)}
.crown{position:absolute; top:11px; right:12px; font-size:15px}

/* ---------- 버튼 ---------- */
.btn{
  display:block; width:100%; padding:14px 16px; border-radius:13px; border:1px solid var(--acc);
  background:var(--acc); color:var(--acc-ink); font:inherit; font-weight:600; font-size:15.5px;
  cursor:pointer; text-align:center; box-shadow:var(--shadow);
}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card); color:var(--ink); border-color:var(--rule); box-shadow:none}
.btn.ghost:hover{background:var(--card-2); filter:none}
.btn[disabled]{opacity:.42; cursor:not-allowed; filter:none}
.btnrow{display:flex; gap:9px}
.btnrow>*{flex:1}

/* ---------- 모드 선택 ---------- */
.modecard{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--rule); border-radius:15px; padding:14px 15px;
  box-shadow:var(--shadow); color:inherit; font:inherit; margin-bottom:9px; transition:transform .12s;
}
.modecard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.modecard[disabled]{opacity:.5; cursor:not-allowed; transform:none; box-shadow:var(--shadow)}
.modecard .ic{
  width:42px; height:42px; flex:none; border-radius:12px; display:grid; place-items:center;
  font-size:20px; background:var(--card-2); border:1px solid var(--rule-2);
}
.modecard .t{font-weight:600; font-size:15px}
.modecard .d{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.modecard .go{margin-left:auto; color:var(--ink-3); font-size:18px}

/* ---------- 플레이 ---------- */
.hud{display:flex; align-items:center; gap:10px; margin-bottom:12px; min-height:34px}
.hp{display:flex; gap:4px; font-size:17px; line-height:1}
.hp .gone{opacity:.2; filter:grayscale(1)}
.hudsp{flex:1}
.score{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; letter-spacing:-.02em}
.qcount{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-3)}
.combo{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:13px; letter-spacing:-.01em;
  padding:3px 9px; border-radius:99px; background:var(--warn); color:#fff; opacity:0; transform:scale(.7);
  transition:opacity .2s, transform .2s;
}
.combo.on{opacity:1; transform:scale(1)}

.timebar{height:5px; border-radius:99px; background:var(--rule-2); overflow:hidden; margin-bottom:16px}
.timebar>i{display:block; height:100%; background:var(--ok); border-radius:99px; transform-origin:left}
.timebar.warn>i{background:var(--warn)}
.timebar.danger>i{background:var(--bad)}

.wordcard{
  background:var(--card); border:1px solid var(--rule); border-radius:18px;
  padding:26px 20px; text-align:center; box-shadow:var(--shadow); margin-bottom:14px; position:relative;
}
.wordcard .tag{
  position:absolute; top:11px; left:13px; font-size:10.5px; font-weight:600; letter-spacing:.06em;
  color:var(--ink-3); text-transform:uppercase;
}
.wordcard .hlmark{position:absolute; top:10px; right:13px; font-size:13px; color:var(--warn)}
.word{
  font-family:'Bricolage Grotesque','IBM Plex Sans KR',sans-serif; font-weight:800;
  font-size:clamp(28px,8.5vw,42px); line-height:1.15; letter-spacing:-.025em; word-break:break-word;
}
.wordcard .ask{font-size:12.5px; color:var(--ink-3); margin-top:9px}
.wordcard .polynote{
  font-size:12px; color:var(--warn); margin-top:7px; font-weight:600;
}

.choices{display:flex; flex-direction:column; gap:8px}
.choice{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--rule); border-radius:13px; padding:13px 14px;
  font:inherit; font-size:15px; color:var(--ink); box-shadow:var(--shadow); transition:transform .1s;
}
.choice:hover:not([disabled]){transform:translateX(3px)}
.choice[disabled]{cursor:default}
.choice .k{
  width:24px; height:24px; flex:none; border-radius:7px; display:grid; place-items:center;
  background:var(--card-2); border:1px solid var(--rule-2);
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--ink-3);
}
.choice.right{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.choice.right .k{background:var(--ok); border-color:var(--ok); color:#fff}
.choice.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.choice.wrong .k{background:var(--bad); border-color:var(--bad); color:#fff}
.choice.dim{opacity:.4}

.reveal{
  margin-top:13px; background:var(--card); border:1px solid var(--rule); border-left:4px solid var(--fc,var(--acc));
  border-radius:12px; padding:12px 14px; box-shadow:var(--shadow);
}
.reveal .rw{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.02em}
.reveal .rm{font-size:14px; color:var(--ink-2); margin-top:4px; line-height:1.55}
.reveal .rg{font-size:11.5px; color:var(--ink-3); margin-top:6px; font-family:'IBM Plex Mono',monospace}

.shake{animation:shake .32s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)} 45%{transform:scale(1.035)} 100%{transform:scale(1)}}
.floatup{
  position:fixed; left:50%; top:38%; transform:translateX(-50%);
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:30px; letter-spacing:-.02em;
  color:var(--ok); pointer-events:none; z-index:50; animation:floatup .85s ease-out forwards;
}
@keyframes floatup{
  0%{opacity:0; transform:translateX(-50%) translateY(14px) scale(.85)}
  22%{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
  100%{opacity:0; transform:translateX(-50%) translateY(-46px) scale(1)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}

/* ---------- 결과 ---------- */
.result{text-align:center; padding:8px 0 4px}
.result .big{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:56px; line-height:1;
  letter-spacing:-.035em; margin:6px 0;
}
.result .bigstars{font-size:34px; letter-spacing:5px; color:var(--warn); margin:10px 0 4px}
.result .bigstars .off{color:var(--rule)}
.result .head{font-size:15px; font-weight:600; color:var(--ink-2)}
.result .newrec{
  display:inline-block; margin-top:8px; padding:4px 12px; border-radius:99px;
  background:var(--warn); color:#fff; font-size:12.5px; font-weight:600;
}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:18px 0}
.stat{background:var(--card); border:1px solid var(--rule); border-radius:13px; padding:11px 8px; text-align:center; box-shadow:var(--shadow)}
.stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:19px; letter-spacing:-.02em}
.stat .l{font-size:11px; color:var(--ink-3); margin-top:2px}

/* ---------- 목록/칩 ---------- */
.chiprow{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink-2);
  font:inherit; font-size:13px; cursor:pointer;
}
.chip.on{background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600}
.chip .n{font-family:'IBM Plex Mono',monospace; font-size:11.5px; opacity:.72}

.list{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:flex-start; gap:11px; background:var(--card);
  border:1px solid var(--rule); border-radius:12px; padding:11px 13px; box-shadow:var(--shadow);
}
.row .lw{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; letter-spacing:-.02em; flex:none; max-width:44%; word-break:break-word}
.row .lm{font-size:13px; color:var(--ink-2); flex:1; line-height:1.45}
.row .mast{flex:none; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--ink-3); align-self:center}
.row.done{opacity:.55}

.note{font-size:12.5px; color:var(--ink-3); line-height:1.6; margin:10px 2px}
.empty{
  text-align:center; padding:38px 18px; color:var(--ink-3); font-size:14px; line-height:1.7;
  background:var(--card); border:1px dashed var(--rule); border-radius:15px;
}
h2{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:19px; letter-spacing:-.025em; margin:0; text-wrap:balance}
.listhead{display:flex; align-items:center; gap:11px; margin-bottom:16px}
.listhead .sub{font-size:12px; color:var(--ink-3); margin-top:1px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>

  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function slide(f0, f1, start, dur, vol, type) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

let AUDIO_READY = false;

  if (AUDIO_READY) return;

  try {
    if (c.state === 'suspended') c.resume();
    const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
    src.buffer = b; src.connect(c.destination); src.start(0);
    AUDIO_READY = true;
  } catch (e) { }
}

/* ---------- 저장 ---------- */
function canStore() {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
}
const HAS_STORE = canStore();
let store = { rec: {}, best: {}, boss: {}, sound: 1 };

function load() {

const $ = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[(Math.random() * a.length) | 0];

const MASTER = 2;                                   // 이만큼 맞히면 "외웠다"로 본다
const mastered = it => store.rec[it.i].m >= MASTER;
const dayDone = d => byDay[d].filter(mastered).length;
// 정복률은 한 번 맞힌 것도 절반으로 쳐 준다 — 한 판 풀면 눈에 보이게 올라가도록
function pctOf(pool) {
  if (!pool.length) return 0;
  const got = pool.reduce((s, it) => s + Math.min(store.rec[it.i].m, MASTER), 0);
  return Math.round(got / (pool.length * MASTER) * 100);
}
const dayPct = d => pctOf(byDay[d]);
const allPct = () => pctOf(W);
const wrongPool = d => byDay[d].filter(it => store.rec[it.i].w > 0 && !mastered(it));

function starStr(n, off) {
  let s = '';

/* ---------- 문제 만들기 ---------- */
// 정답이 될 뜻: 보통은 짧은 뜻, 다의어는 여러 뜻 중 하나를 뽑는다
function answerOf(it) {
  if (it.k === 'poly' && it.p && it.p.length > 1) return pick(it.p);
  return it.s;
}
function makeQ(it, poolDay) {
  const ans = answerOf(it);
  const taken = new Set([ans, it.s]);
  const sameGroup = poolDay.filter(x => x.i !== it.i && x.g === it.g);
  const others = poolDay.filter(x => x.i !== it.i && x.g !== it.g);
  const cand = shuffle(sameGroup.slice()).concat(shuffle(others.slice()));
  const opts = [ans];
  for (const c of cand) {
    if (opts.length >= 4) break;
    if (taken.has(c.s) || c.w === it.w) continue;
    taken.add(c.s); opts.push(c.s);
  }
  // 그래도 모자라면 전체에서 채운다 (한 Day가 아주 작을 때 대비)
  if (opts.length < 4) {
    for (const c of shuffle(W.slice())) {
      if (opts.length >= 4) break;
      if (taken.has(c.s) || c.w === it.w) continue;
      taken.add(c.s); opts.push(c.s);
    }
  }
  return { it, ans, opts: shuffle(opts) };
}

// 덜 외운 것부터 뽑되, 같은 순서만 반복되지 않게 살짝 섞는다
function drawWords(pool, n) {
  const scored = pool.map(it => ({ it, k: store.rec[it.i].m * 10 + Math.random() * 9 }));
  scored.sort((a, b) => a.k - b.k);
  return scored.slice(0, n).map(x => x.it);
}

/* ---------- 게임 ---------- */
let G = null, timerId = null, rafId = null;

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

function startGame(d, mode) {
  const m = MODES[mode];
  const pool = mode === 'wrong' ? wrongPool(d) : byDay[d];
  let list;
  if (mode === 'speed') list = shuffle(drawWords(pool, pool.length));
  else list = shuffle(drawWords(pool, Math.min(m.n, pool.length)));

  G = {
    d, mode, m, list, idx: 0,
    hp: m.hp, score: 0, right: 0, wrong: 0, combo: 0, maxCombo: 0,
    missed: [], answered: 0,
    endAt: mode === 'speed' ? Date.now() + SPEED_SEC * 1000 : 0,
    qStart: 0, locked: false,
  };
  nextQ();
}

function nextQ() {
  stopTimer();
  if (!G) return;
  if (G.mode === 'speed') {
    if (Date.now() >= G.endAt) return finish();
    if (G.idx >= G.list.length) { G.list = shuffle(G.list); G.idx = 0; }   // 다 돌면 다시
  } else if (G.idx >= G.list.length) return finish();

  const it = G.list[G.idx];
  G.q = makeQ(it, byDay[G.d]);
  G.locked = false;
  G.qStart = Date.now();
  renderPlay();
  runTimer();
}

function renderPlay() {
  const q = G.q, it = q.it, m = G.m;
  const isPoly = it.k === 'poly' && it.p && it.p.length > 1;
  const total = G.mode === 'speed' ? '' : `<span class="qcount">${G.idx + 1} / ${G.list.length}</span>`;
  const hearts = G.mode === 'speed' ? '' :
    `<span class="hp">${Array.from({ length: m.hp }, (_, i) =>
      `<span class="${i < G.hp ? '' : 'gone'}">${G.mode === 'boss' ? '💀' : '❤️'}</span>`).join('')}</span>`;

  app.innerHTML = '';
  app.append($(`
    <div style="--fc:${famColor(G.d)}">
      <div class="top">
        <button class="iconbtn" id="quit" aria-label="그만두기">✕</button>
        <div class="brand" style="font-size:15px">${m.icon} ${m.name}
          <span>Day ${G.d}</span></div>
        <span class="combo" id="combo"></span>
      </div>
      <div class="hud">
        ${hearts}
        <span class="hudsp"></span>
        ${total}
        <span class="score mono" id="score">${G.score.toLocaleString()}</span>
      </div>
      <div class="timebar" id="tbar"><i id="tfill" style="width:100%"></i></div>
      <div class="wordcard" id="wcard">
        <span class="tag">${esc(it.g)}</span>
        ${it.hl ? '<span class="hlmark" title="교재에 표시된 중요 단어">★</span>' : ''}
        <div class="word">${esc(it.w)}</div>
        <div class="ask">이 단어의 뜻은?</div>
        ${isPoly ? '<div class="polynote">뜻이 여러 개인 단어 · 그중 하나를 고르세요</div>' : ''}
      </div>
      <div class="choices" id="choices"></div>
      <div id="after"></div>
    </div>`));

  const cbox = document.getElementById('choices');
  const keys = ['A', 'B', 'C', 'D'];
  q.opts.forEach((o, i) => {
    const b = $(`<button class="choice" data-v="${esc(o)}"><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`);
    b.onclick = () => answer(o, b);
    cbox.append(b);
  });
  document.getElementById('quit').onclick = () => {
    stopTimer();
    const back = G.d;
    if (confirm('그만둘까요? 지금까지 외운 건 저장돼요.')) { G = null; screenDay(back); }
    else runTimer();
  };
  showCombo();
}

function showCombo() {
  const el = document.getElementById('combo');
  if (!el) return;
  if (G.combo >= 2) { el.textContent = `${G.combo} 연속!`; el.classList.add('on'); }
  else { el.classList.remove('on'); }
}

function runTimer() {
  stopTimer();
  const fill = document.getElementById('tfill'), bar = document.getElementById('tbar');
  if (!fill) return;
  const limit = G.m.sec * 1000;
  let lastTick = 99;
  const step = () => {
    if (!G || G.locked) return;
    let ratio, left;
    if (G.mode === 'speed') {
      left = G.endAt - Date.now();
      ratio = Math.max(0, left / (SPEED_SEC * 1000));
      if (left <= 0) { stopTimer(); return finish(); }
    } else {
      left = limit - (Date.now() - G.qStart);
      ratio = Math.max(0, left / limit);
      if (left <= 0) { stopTimer(); return answer(null, null); }
    }
    fill.style.width = (ratio * 100) + '%';
    bar.className = 'timebar' + (ratio < 0.22 ? ' danger' : ratio < 0.5 ? ' warn' : '');
    const s = Math.ceil(left / 1000);
    if (s <= 3 && s !== lastTick && s > 0) { tick(); lastTick = s; }
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

function floatText(txt, color) {
  const el = $(`<div class="floatup" style="color:${color}">${esc(txt)}</div>`);
  document.body.append(el);
  setTimeout(() => el.remove(), 900);
}

function answer(val, btn) {
  if (!G || G.locked) return;
  G.locked = true;
  stopTimer();

  const q = G.q, it = q.it, r = store.rec[it.i];
  const ok = val !== null && val === q.ans;
  const elapsed = Date.now() - G.qStart;
  r.a++;
  G.answered++;

  if (ok) {
    r.m = Math.min(3, r.m + 1);
    G.right++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    const speedBonus = Math.max(0, Math.round(40 * (1 - elapsed / (G.m.sec * 1000))));
    const mult = 1 + Math.min(G.combo - 1, 10) * 0.1;
    const gain = Math.round((60 + speedBonus) * mult);
    G.score += gain;
    if (G.combo >= 3) comboTone(G.combo); else dingdong();
    floatText('+' + gain, 'var(--ok)');
  } else {
    r.m = Math.max(0, r.m - 1);
    r.w++;
    G.wrong++; G.combo = 0;
    G.missed.push(it);
    if (G.mode !== 'speed') G.hp--;
    else G.endAt -= 3000;                                  // 스피드런은 목숨 대신 3초 깎기
    ttaeng();
    if (G.mode !== 'speed') hurt();
  }
  save();

  // 보기 색칠
  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.ans) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const card = document.getElementById('wcard');
  if (card) card.classList.add(ok ? 'pop' : 'shake');
  const sc = document.getElementById('score');
  if (sc) sc.textContent = G.score.toLocaleString();
  showCombo();

  // 틀렸으면 전체 뜻을 보여 준다
  const after = document.getElementById('after');
  if (!ok && after) {
    after.append($(`
      <div class="reveal">
        <div class="rw">${esc(it.w)}</div>
        <div class="rm">${esc(it.m)}</div>
        <div class="rg">Day ${it.d} · ${esc(it.g)}</div>
      </div>`));
  }

  G.idx++;
  const dead = G.mode !== 'speed' && G.hp <= 0;
  const delay = ok ? 520 : 1500;
  setTimeout(() => { if (!G) return; if (dead) finish(true); else nextQ(); }, delay);
}

/* ---------- 결과 ---------- */
function starsFor(G, survived) {
  if (!survived) return 0;
  if (G.mode === 'speed') return G.right >= 25 ? 3 : G.right >= 15 ? 2 : G.right >= 8 ? 1 : 0;
  const acc = G.answered ? G.right / G.answered : 0;
  if (G.right === G.list.length) return 3;
  if (acc >= 0.8) return 2;
  if (acc >= 0.6) return 1;
  return 0;
}

function finish(dead) {
  stopTimer();
  if (!G) return;
  const g = G, d = g.d, survived = !dead;
  const stars = starsFor(g, survived);
  const prev = store.best[d];
  const isRecord = survived && g.mode !== 'wrong' && (!prev || g.score > prev.score);
  if (isRecord) store.best[d] = { score: g.score, stars: Math.max(stars, prev ? prev.stars : 0) };
  else if (survived && prev && stars > prev.stars) store.best[d].stars = stars;
  const bossCleared = g.mode === 'boss' && survived && g.right === g.list.length;
  const newCrown = bossCleared && !store.boss[d];
  if (bossCleared) store.boss[d] = 1;
  save();

  if (!survived) gameover();
  else if (stars === 3 || newCrown) fanfare();
  else levelup();

  const meta = DAYMETA[d];
  const acc = g.answered ? Math.round(g.right / g.answered * 100) : 0;
  const head = !survived ? '쓰러졌어요' :
    g.mode === 'boss' ? (bossCleared ? '보스 격파!' : '보스전 끝') :
      g.mode === 'speed' ? `${SPEED_SEC}초 끝!` : '원정 완료';

  app.innerHTML = '';
  app.append($(`
    <div style="--fc:${famColor(d)}">
      <div class="result">
        <div class="head">${head}</div>
        <div class="big mono" style="color:var(--fc)">${g.score.toLocaleString()}</div>
        <div class="bigstars">${starStr(stars)}</div>
        ${newCrown ? '<div class="newrec">👑 Day ' + d + ' 정복!</div>' :
      isRecord ? '<div class="newrec">최고 기록 경신!</div>' : ''}
      </div>
      <div class="statgrid">
        <div class="stat"><div class="v">${g.right}</div><div class="l">맞힘</div></div>
        <div class="stat"><div class="v">${g.wrong}</div><div class="l">틀림</div></div>
        <div class="stat"><div class="v">${acc}%</div><div class="l">정확도</div></div>
        <div class="stat"><div class="v">${g.maxCombo}</div><div class="l">최고 연속</div></div>
        <div class="stat"><div class="v">${dayPct(d)}%</div><div class="l">Day ${d} 정복</div></div>
        <div class="stat"><div class="v">${allPct()}%</div><div class="l">전체</div></div>
      </div>
      <div id="missed"></div>
      <div class="btnrow" style="margin-top:18px">
        <button class="btn ghost" id="again">다시 하기</button>
        <button class="btn" id="toDay">Day ${d}로</button>
      </div>
      <button class="btn ghost" id="toHome" style="margin-top:9px">방향 지도로</button>
    </div>`));

  if (g.missed.length) {
    const box = document.getElementById('missed');
    box.append($(`<div class="kicker">놓친 단어 ${g.missed.length}개</div>`));
    const list = $('<div class="list"></div>');
    const seen = new Set();
    g.missed.forEach(it => {
      if (seen.has(it.i)) return; seen.add(it.i);
      list.append($(`<div class="row"><span class="lw">${esc(it.w)}</span><span class="lm">${esc(it.m)}</span></div>`));
    });
    box.append(list);
  }
  const mode = g.mode;
  document.getElementById('again').onclick = () => startGame(d, mode);
  document.getElementById('toDay').onclick = () => { G = null; screenDay(d); };
  document.getElementById('toHome').onclick = () => { G = null; screenHome(); };
  G = null;
}

/* ---------- 단어장 ---------- */
let listDay = null, listFilter = 'all';
function screenList(d) {
  stopTimer();
  listDay = d;
  const pool = d ? byDay[d] : W;
  app.innerHTML = '';
  app.append($(`
    <div${d ? ` style="--fc:${famColor(d)}"` : ''}>
      <div class="listhead">
        <button class="iconbtn" id="back" aria-label="뒤로">←</button>
        <div style="flex:1">
          <h2>${d ? `Day ${d} 단어장` : '단어장'}</h2>
          <div class="sub">${pool.length}단어 · ${pool.filter(mastered).length}개 외움</div>
        </div>
      </div>
      <div class="chiprow" id="days"></div>
      <div class="chiprow" id="filters"></div>
      <div id="lbody"></div>
    </div>`));

  if (!d) {
    const dbox = document.getElementById('days');
    DAYS.forEach(x => {
      const c = $(`<button class="chip">Day ${x}<span class="n">${dayPct(x)}%</span></button>`);
      c.onclick = () => screenList(x);
      dbox.append(c);
    });
  } else {
    document.getElementById('days').remove();
  }

  const fbox = document.getElementById('filters');
  const filters = [
    ['all', '전체', pool.length],
    ['todo', '아직', pool.filter(it => !mastered(it)).length],
    ['wrong', '틀린 적 있음', pool.filter(it => store.rec[it.i].w > 0).length],
    ['star', '교재 표시', pool.filter(it => it.hl).length],
    ['done', '외운 것', pool.filter(mastered).length],
  ];
  filters.forEach(([k, label, n]) => {
    const c = $(`<button class="chip${listFilter === k ? ' on' : ''}">${label}<span class="n">${n}</span></button>`);
    c.onclick = () => { listFilter = k; screenList(d); };
    fbox.append(c);
  });

  const body = document.getElementById('lbody');
  let items = pool;
  if (listFilter === 'todo') items = pool.filter(it => !mastered(it));
  else if (listFilter === 'wrong') items = pool.filter(it => store.rec[it.i].w > 0);
  else if (listFilter === 'star') items = pool.filter(it => it.hl);
  else if (listFilter === 'done') items = pool.filter(mastered);

  if (!items.length) {
    body.append($('<div class="empty">여기에 해당하는 단어가 없어요.</div>'));
  } else {
    // 묶음별로 나눠서 보여 준다
    const groups = [];
    const gmap = new Map();
    for (const it of items) {
      const k = (d ? '' : `Day ${it.d} · `) + it.g;
      if (!gmap.has(k)) { gmap.set(k, []); groups.push(k); }
      gmap.get(k).push(it);
    }
    groups.forEach(k => {
      body.append($(`<div class="kicker">${esc(k)}</div>`));
      const list = $('<div class="list"></div>');
      gmap.get(k).forEach(it => {
        const r = store.rec[it.i];
        const done = mastered(it);
        list.append($(`
          <div class="row${done ? ' done' : ''}">
            <span class="lw">${esc(it.w)}${it.hl ? ' <span style="color:var(--warn);font-size:11px">★</span>' : ''}</span>
            <span class="lm">${esc(it.m)}</span>
            <span class="mast">${done ? '✓' : (r.w ? '✕' + r.w : '·')}</span>
          </div>`));
      });
      body.append(list);
    });
  }
  document.getElementById('back').onclick = () => d ? screenDay(d) : screenHome();
}

/* ---------- 설정 ---------- */
function screenSettings() {
  stopTimer();
  const wrongAll = W.filter(it => store.rec[it.i].w > 0 && !mastered(it));
  app.innerHTML = '';
  app.append($(`
    <div>
      <div class="listhead">
        <button class="iconbtn" id="back" aria-label="뒤로">←</button>
        <h2>설정</h2>
      </div>
      <div class="kicker">소리</div>
      <button class="btn ghost" id="snd">${SOUND ? '🔔 소리 켜짐' : '🔕 소리 꺼짐'}</button>
      <div class="kicker">지금까지</div>
      <div class="statgrid">
        <div class="stat"><div class="v">${W.filter(mastered).length}</div><div class="l">외운 단어</div></div>
        <div class="stat"><div class="v">${wrongAll.length}</div><div class="l">못 외운 것</div></div>
        <div class="stat"><div class="v">${Object.keys(store.boss).length}</div><div class="l">정복한 Day</div></div>
      </div>
      <button class="btn ghost" id="report" style="margin-bottom:9px">📋 아빠에게 진도 보내기</button>
      <div class="kicker">처음부터</div>
      <button class="btn ghost" id="reset" style="color:var(--bad);border-color:var(--bad)">기록 모두 지우기</button>
      <div class="note">${HAS_STORE ? '기록은 이 아이패드 안에만 저장돼요.' :
      '이 브라우저는 저장을 막고 있어서 기록이 남지 않아요.'}</div>
    </div>`));
  document.getElementById('back').onclick = screenHome;
  document.getElementById('snd').onclick = () => {
    SOUND = !SOUND; store.sound = SOUND ? 1 : 0; save();
    if (SOUND) dingdong();
    screenSettings();
  };
  document.getElementById('report').onclick = shareReport;
  document.getElementById('reset').onclick = () => {
    if (!confirm('정말 모든 기록을 지울까요? 되돌릴 수 없어요.')) return;
    store = { rec: {}, best: {}, boss: {}, sound: SOUND ? 1 : 0 };
    for (const it of W) store.rec[it.i] = { m: 0, a: 0, w: 0 };
    save(); screenHome();
  };
}

function reportText() {
  const L = [];
  L.push('[영어 단어 · 어근 원정대 진도]');
  L.push(`정복률 ${allPct()}% · 완전히 외운 단어 ${W.filter(mastered).length}개 / ${W.length}개`);
  L.push('');
  L.push('■ Day별');
  DAYS.forEach(d => {
    const b = store.best[d];
    L.push(`  Day ${d} ${DAYMETA[d].dir} — ${dayPct(d)}%` +
      (b ? ` · 최고 ${b.score.toLocaleString()}점 ${'★'.repeat(b.stars)}` : '') +
      (store.boss[d] ? ' 👑' : ''));
  });
  const weak = W.filter(it => store.rec[it.i].w > 0 && !mastered(it))
    .sort((a, b) => store.rec[b.i].w - store.rec[a.i].w);
  L.push('');
  L.push(`■ 아직 못 외운 단어 ${weak.length}개`);
  weak.slice(0, 50).forEach((it, i) => {
    L.push(`  ${i + 1}) ${it.w} — ${it.m}  (${store.rec[it.i].w}번 틀림)`);
  });
  if (weak.length > 50) L.push(`  … 외 ${weak.length - 50}개`);
  return L.join('\n');
}

async function shareReport() {
  const txt = reportText();
  const btn = document.getElementById('report');
  try { if (navigator.share) { await navigator.share({ title: '영어 단어 진도', text: txt }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(txt);
    btn.textContent = '복사했어요 · 카톡에 붙여넣기';
    setTimeout(() => { btn.textContent = '📋 아빠에게 진도 보내기'; }, 2500);
    return;
  } catch (e) { }
  const ta = $(`<textarea style="width:100%;height:220px;font-size:12px;font-family:monospace;margin-top:10px;
    border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)"></textarea>`);
  ta.value = txt;
  btn.after(ta); ta.select();
}

screenHome();
</script>
</body>
</html>
